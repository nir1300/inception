server {
    # configure https server
    #listen on port 443 for ipv4 and ipv6 with ssl/tls enabled, set domain name
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nrumpfhu.42.fr www.nrumpfhu.42.fr;

    # ssl/tls settings, certificate and key are generated in Dockerfile, tls = transport layer security (cryptographic protocol)
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols TLSv1.3;

    #set document root and default pages for website files
    root /var/www/html;
    index index.php index.html;

    # rest of conf file is standard for wordpress+nginx+php-fpm
    # try exact file requested first, then directory, falls back to index.php if not found
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # forward request for a php file to wordpress:9000 (=the php-fpm container)
    # look for files ending in .php -> wordpress files are php
    # uses fastCGI protocol
    location ~ \.php$ {
        include fastcgi_params;
	fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

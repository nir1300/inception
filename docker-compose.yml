services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb:42
    restart: always
    volumes:
      - /home/nrumpfhu/data/mariadb:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx:42
    ports:
      - 443:443
    depends_on:
    - wordpress
    restart: always
    volumes:
      - /home/nrumpfhu/data/wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - .env
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:42
    depends_on:
    - mariadb
    restart: always
    volumes:
      - /home/nrumpfhu/data/wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - .env

networks:
  inception:
    name: inception
